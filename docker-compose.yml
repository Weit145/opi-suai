services:
  postgres:
    image: postgres:16
    restart: unless-stopped

    environment:
      POSTGRES_USER: redmine
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: redmine

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redmine -d redmine"]
      interval: 5s
      timeout: 5s
      retries: 10

  redmine:
    image: redmine:6.1.5
    restart: unless-stopped

    ports:
      - "${REDMINE_PORT:-8080}:3000"

    environment:
      REDMINE_DB_POSTGRES: postgres
      REDMINE_DB_USERNAME: redmine
      REDMINE_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      REDMINE_DB_DATABASE: redmine
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE in .env}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - redmine_files:/usr/src/redmine/files
      - ./themes:/usr/src/redmine/themes

volumes:
  postgres_data:
  redmine_files:
